<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581825" />
      <stop offset="100%" stop-color="#3F0F19" />
    </linearGradient>
  </defs>

  <!-- Clean Burgundy Splash Canvas -->
  <rect width="1200" height="1200" fill="url(#splashBg)" />

  <!-- Center Emblem -->
  <g transform="translate(600, 500) scale(1.6)">
    <!-- Pin & Search Combination -->
    <path d="M 0 -130 
             C 72 -130, 130 -72, 130 0 
             C 130 65, 50 145, 0 190 
             C -50 145, -130 65, -130 0 
             C -130 -72, -72 -130, 0 -130 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Magnifier Handle -->
    <path d="M 85 95 L 145 155" 
          stroke="#FFFFFF" 
          stroke-width="26" 
          stroke-linecap="round" />

    <!-- Center Package & Sparkle -->
    <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="8" />
    <path d="M 0 -26 Q 0 0 -26 0 Q 0 0 0 26 Q 0 0 26 0 Q 0 0 0 -26 Z" fill="#FFFFFF" />
  </g>

  <!-- Splash Title & Subtitle -->
  <g transform="translate(600, 850)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="4">
      TEMU BARANG
    </text>
    
    <g transform="translate(0, 45)">
      <rect x="-110" y="0" width="220" height="38" rx="19" fill="#FBEAEB" fill-opacity="0.18" stroke="#FBEAEB" stroke-width="1.5" />
      <text text-anchor="middle" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FBEAEB" letter-spacing="3">
        LOST &amp; FOUND
      </text>
    </g>

    <text text-anchor="middle" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="rgba(255, 255, 255, 0.65)" letter-spacing="0.5">
      Universitas Muhammadiyah Malang
    </text>
  </g>
</svg>
