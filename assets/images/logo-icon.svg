<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient Background Burgundy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1D2F" />
      <stop offset="60%" stop-color="#581825" />
      <stop offset="100%" stop-color="#3F0F19" />
    </linearGradient>

    <!-- Gradient Aksen Gold-Rose -->
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBEAEB" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#subtleShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#FBEAEB" stroke-width="4" stroke-opacity="0.15" />

  <!-- Outer Search & Pin Emblem -->
  <!-- Lingkaran Kaca Pembesar & Pin Lokasi Menyatu -->
  <g transform="translate(256, 230)" filter="url(#subtleShadow)">
    <!-- Pin / Radar Drop Shape Base -->
    <path d="M 0 -130 
             C 72 -130, 130 -72, 130 0 
             C 130 65, 50 145, 0 190 
             C -50 145, -130 65, -130 0 
             C -130 -72, -72 -130, 0 -130 Z" 
          fill="none" 
          stroke="url(#roseAccent)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Gagang Kaca Pembesar (Magnifier Handle) Modern di Kanan Bawah -->
    <path d="M 85 95 L 145 155" 
          stroke="url(#roseAccent)" 
          stroke-width="28" 
          stroke-linecap="round" />

    <!-- Simbol Kotak / Barang Ditemukan (Found Package / Box Icon) -->
    <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="8" />
    
    <!-- Sparkle / Bintang Penemuan (Discovery Star) di Tengah -->
    <path d="M 0 -28 Q 0 0 -28 0 Q 0 0 0 28 Q 0 0 28 0 Q 0 0 0 -28 Z" fill="#FFFFFF" />
    
    <!-- Lingkaran Inti Bersinar -->
    <circle cx="0" cy="0" r="6" fill="#6B1D2F" />
  </g>
</svg>
